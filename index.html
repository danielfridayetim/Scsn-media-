<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCSN Media Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-deep:#EAF3EC;
    --ink:#123524;
    --forest:#1D6B3E;
    --rust:#1D6B3E;
    --gold:#2F8F52;
    --line: rgba(18,53,36,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(rgba(35,34,32,0.035) 1px, transparent 1px);
    background-size:3px 3px;
    pointer-events:none;
    z-index:0;
  }
  a{color:inherit;}
  .wrap{max-width:1040px; margin:0 auto; padding:0 24px; position:relative; z-index:1;}

  .logo-row{
    display:flex; align-items:center; gap:14px;
    margin-bottom:14px;
  }
  .org-logo{
    height:56px; width:56px;
    object-fit:contain;
    border-radius:50%;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .logo-divider{
    width:1px; height:34px;
    background:var(--line);
  }

  header.masthead{
    border-bottom:3px solid var(--ink);
    padding:28px 0 16px;
  }
  .masthead-row{
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;
  }
  .brand-mark{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--forest); margin-bottom:6px;
  }
  h1.title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(38px, 7vw, 64px);
    line-height:0.95;
    letter-spacing:-0.01em;
  }
  .masthead-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    text-align:right;
    color:rgba(35,34,32,0.6);
    line-height:1.6;
  }
  .tagline{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:17px;
    color:rgba(35,34,32,0.75);
    margin-top:10px;
    max-width:520px;
  }

  nav.tabs{
    display:flex; gap:4px;
    margin-top:22px;
    overflow-x:auto;
  }
  nav.tabs button{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    background:var(--paper-deep);
    border:1px solid var(--ink);
    border-bottom:none;
    padding:10px 18px;
    cursor:pointer;
    color:var(--ink);
    position:relative;
    top:1px;
    white-space:nowrap;
    transition:background 0.15s ease, color 0.15s ease;
  }
  nav.tabs button.active{
    background:var(--ink);
    color:var(--paper);
  }
  nav.tabs button:hover:not(.active){
    background:#DCD2B8;
  }
  nav.tabs button:focus-visible{outline:2px solid var(--rust); outline-offset:2px;}

  main{
    border:1px solid var(--ink);
    border-top:none;
    min-height:60vh;
    padding:32px 0 60px;
    background:var(--paper);
  }
  .panel{display:none; padding:0 24px;}
  .panel.active{display:block; animation:fade 0.35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .panel-head{
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--line);
    padding-bottom:14px; margin-bottom:24px; flex-wrap:wrap; gap:12px;
  }
  .panel-head h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:26px;
  }
  .count-tag{
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    color:rgba(35,34,32,0.55);
  }

  .upload-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.05em; text-transform:uppercase;
    background:var(--forest); color:var(--paper);
    border:none; padding:10px 16px; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
    transition:background 0.15s ease;
  }
  .upload-btn:hover{background:#243c30;}
  .upload-btn:focus-visible{outline:2px solid var(--rust); outline-offset:2px;}
  input[type=file]{display:none;}

  .stamp{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    border:1.5px solid var(--rust);
    color:var(--rust);
    padding:2px 7px;
    transform:rotate(-2deg);
    border-radius:2px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:16px;
  }
  .tile{
    background:var(--paper-deep);
    border:1px solid var(--ink);
    position:relative;
    aspect-ratio:1;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .tile img, .tile iframe{width:100%; height:100%; object-fit:cover; display:block; border:0;}
  .tile a.video-link{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:100%; height:100%; text-decoration:none; color:var(--ink);
    padding:10px; text-align:center;
  }
  .tile a.video-link .play-ico{font-size:28px; margin-bottom:8px;}
  .tile a.video-link .vtitle{
    font-family:'IBM Plex Mono', monospace; font-size:11px; word-break:break-word;
  }
  .tile .tile-meta{
    position:absolute; bottom:0; left:0; right:0;
    background:linear-gradient(transparent, rgba(35,34,32,0.85));
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    padding:16px 8px 6px;
  }

  .news-item{
    border-bottom:1px solid var(--line);
    padding:18px 0;
    display:grid;
    grid-template-columns:90px 1fr;
    gap:18px;
  }
  .news-item:first-child{padding-top:0;}
  .news-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:rgba(35,34,32,0.55);
    padding-top:4px;
  }
  .news-headline{
    font-family:'Fraunces', serif; font-weight:600; font-size:19px;
    margin-bottom:4px;
  }
  .news-body{font-size:14px; color:rgba(35,34,32,0.75); line-height:1.55;}

  .file-row{
    display:flex; align-items:center; gap:14px;
    border-bottom:1px solid var(--line);
    padding:14px 0;
  }
  .file-icon{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:0.05em;
    border:1px solid var(--ink);
    padding:6px 8px;
    text-transform:uppercase;
  }
  .file-name{font-weight:600; font-size:14.5px;}
  .file-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; color:rgba(35,34,32,0.55);
  }
  .file-row .dl{
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; text-transform:uppercase;
    color:var(--forest); text-decoration:none;
    border-bottom:1px solid var(--forest);
    padding-bottom:1px;
  }

  .empty-state{
    text-align:center; padding:50px 20px;
    color:rgba(35,34,32,0.5);
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
  }

  .lock-btn{
    margin-top:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
    background:transparent;
    border:1px solid var(--ink);
    padding:6px 12px;
    cursor:pointer;
    color:var(--ink);
  }
  .lock-btn.unlocked{
    background:var(--forest);
    color:var(--paper);
    border-color:var(--forest);
  }
  .lock-btn:focus-visible{outline:2px solid var(--rust); outline-offset:2px;}

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(35,34,32,0.55);
    display:none;
    align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--paper);
    border:2px solid var(--ink);
    max-width:340px; width:100%;
    padding:24px;
  }
  .modal-box h3{
    font-family:'Fraunces', serif; font-weight:600; font-size:20px;
    margin-bottom:14px;
  }
  .modal-box input[type=password], .modal-box input[type=text]{
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--ink);
    background:var(--paper-deep);
    color:var(--ink);
    margin-bottom:10px;
  }
  .modal-box textarea{
    width:100%; font-family:'Public Sans',sans-serif; font-size:14px;
    padding:10px 12px; border:1px solid var(--ink); background:var(--paper-deep);
    color:var(--ink); margin-bottom:10px; resize:vertical;
  }
  .modal-box input:focus, .modal-box textarea:focus{outline:2px solid var(--rust); outline-offset:1px;}
  .modal-error{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px; color:var(--rust);
    min-height:16px; margin-bottom:8px;
  }
  .modal-actions{display:flex; gap:8px; margin-top:6px;}
  .modal-actions button{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
    padding:9px 14px; cursor:pointer; border:1px solid var(--ink);
  }
  .modal-actions .submit-btn{background:var(--forest); color:var(--paper); border-color:var(--forest);}
  .modal-actions .cancel-btn{background:transparent; color:var(--ink);}

  .upload-btn.disabled{
    background:rgba(35,34,32,0.15);
    color:rgba(35,34,32,0.45);
    cursor:not-allowed;
    pointer-events:none;
  }

  footer{
    text-align:center;
    padding:24px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:rgba(35,34,32,0.45);
    letter-spacing:0.05em;
  }

  @media (max-width:520px){
    .news-item{grid-template-columns:1fr;}
    .news-date{padding-top:0;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="logo-row">
      <img src="uniuyo-logo-6.jpg" alt="University of Uyo logo" class="org-logo">
      <div class="logo-divider"></div>
      <img src="scsn-logo-4.jpg" alt="Students' Chemical Society of Nigeria logo" class="org-logo">
    </div>
    <div class="masthead-row">
      <div>
        <div class="brand-mark">Est. 2026 — Public Record</div>
        <h1 class="title">SCSN Media Team</h1>
        <p class="tagline">Our organization's open archive — photos, video, news, and files, kept in one place.</p>
      </div>
      <div class="masthead-meta">
        <div id="liveClock">—</div>
        <button id="lockBtn" class="lock-btn">🔒 Admin</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="active" data-panel="photos">Photos</button>
      <button data-panel="videos">Videos</button>
      <button data-panel="news">News</button>
      <button data-panel="files">Files</button>
    </nav>
  </header>

  <main>
    <section class="panel active" id="panel-photos">
      <div class="panel-head">
        <h2>Photos</h2>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="count-tag" id="photoCount">0 items</span>
          <button class="upload-btn admin-control disabled" id="photoLabel">+ Upload photo</button>
          <input type="file" accept="image/*" id="photoInput" multiple style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;">
        </div>
      </div>
      <div class="grid" id="photoGrid"></div>
    </section>

    <section class="panel" id="panel-videos">
      <div class="panel-head">
        <h2>Videos</h2>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="count-tag" id="videoCount">0 items</span>
          <button class="upload-btn admin-control disabled" id="videoAddBtn">+ Add video</button>
        </div>
      </div>
      <div class="grid" id="videoGrid"></div>
    </section>

    <section class="panel" id="panel-news">
      <div class="panel-head">
        <h2>News</h2>
        <button class="upload-btn admin-control disabled" id="newPostBtn" disabled>+ Post update</button>
      </div>
      <div id="newsList"></div>
    </section>

    <section class="panel" id="panel-files">
      <div class="panel-head">
        <h2>Files</h2>
        <div style="display:flex; align-items:center; gap:14px;">
          <span class="count-tag" id="fileCount">0 items</span>
          <button class="upload-btn admin-control disabled" id="fileAddBtn">+ Add file</button>
        </div>
      </div>
      <div id="filesList"></div>
    </section>
  </main>

  <footer>SCSN MEDIA TEAM — POWERED BY SUPABASE — SHARED WITH ALL VISITORS</footer>
</div>

<div class="modal-overlay" id="loginOverlay">
  <div class="modal-box">
    <h3>Admin login</h3>
    <input type="password" id="passwordField" placeholder="Password" autocomplete="off">
    <div class="modal-error" id="loginError"></div>
    <div class="modal-actions">
      <button class="submit-btn" id="submitLogin">Unlock</button>
      <button class="cancel-btn" id="cancelLogin">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="postOverlay">
  <div class="modal-box">
    <h3>Post update</h3>
    <input type="text" id="headlineField" placeholder="Headline" autocomplete="off">
    <textarea id="bodyField" placeholder="Details (optional)" rows="4"></textarea>
    <div class="modal-actions">
      <button class="submit-btn" id="submitPost">Publish</button>
      <button class="cancel-btn" id="cancelPost">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="videoOverlay">
  <div class="modal-box">
    <h3>Add video</h3>
    <input type="text" id="videoTitleField" placeholder="Title" autocomplete="off">
    <input type="text" id="videoUrlField" placeholder="YouTube / Drive link" autocomplete="off">
    <div class="modal-actions">
      <button class="submit-btn" id="submitVideo">Add</button>
      <button class="cancel-btn" id="cancelVideo">Cancel</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="fileOverlay">
  <div class="modal-box">
    <h3>Add file</h3>
    <input type="text" id="fileNameField" placeholder="File name" autocomplete="off">
    <input type="text" id="fileUrlField" placeholder="Drive / Dropbox link" autocomplete="off">
    <div class="modal-actions">
      <button class="submit-btn" id="submitFile">Add</button>
      <button class="cancel-btn" id="cancelFile">Cancel</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const supabaseUrl = 'https://nffucltkcfhruvlwxuem.supabase.co';
  const supabaseKey = 'sb_publishable_PH7ut3tqGP47QCHLuELg2g_Qz6Qp6v-';
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  // ---- Tab switching ----
  const tabs = document.querySelectorAll('#tabs button');
  tabs.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tabs.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      document.getElementById('panel-'+btn.dataset.panel).classList.add('active');
    });
  });

  // ---- Clock ----
  function updateClock(){
    const d = new Date();
    document.getElementById('liveClock').textContent =
      d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}).toUpperCase() +
      ' — VOL. ' + d.getFullYear();
  }
  updateClock();

  // ---- Admin lock ----
  const ADMIN_PASSWORD = 'scsn2026';
  let isUnlocked = false;
  const lockBtn = document.getElementById('lockBtn');

  function setLocked(locked){
    isUnlocked = !locked;
    lockBtn.textContent = locked ? '🔒 Admin' : '🔓 Admin (unlocked)';
    lockBtn.classList.toggle('unlocked', !locked);
    document.querySelectorAll('.admin-control').forEach(el=>{
      el.classList.toggle('disabled', locked);
    });
    const postBtn = document.getElementById('newPostBtn');
    if(postBtn) postBtn.disabled = locked;
  }

  lockBtn.addEventListener('click', ()=>{
    if(isUnlocked){ setLocked(true); return; }
    openModal('loginOverlay');
    document.getElementById('loginError').textContent = '';
    document.getElementById('passwordField').value = '';
    setTimeout(()=>document.getElementById('passwordField').focus(), 50);
  });

  function openModal(id){ document.getElementById(id).classList.add('open'); }
  function closeModal(id){ document.getElementById(id).classList.remove('open'); }

  document.querySelectorAll('.modal-overlay').forEach(ov=>{
    ov.addEventListener('click', e=>{ if(e.target === ov) ov.classList.remove('open'); });
  });

  function attemptLogin(){
    const pwField = document.getElementById('passwordField');
    if(pwField.value === ADMIN_PASSWORD){
      setLocked(false);
      closeModal('loginOverlay');
    } else {
      document.getElementById('loginError').textContent = 'Incorrect password.';
      pwField.value = '';
      pwField.focus();
    }
  }
  document.getElementById('submitLogin').addEventListener('click', attemptLogin);
  document.getElementById('cancelLogin').addEventListener('click', ()=>closeModal('loginOverlay'));
  document.getElementById('passwordField').addEventListener('keydown', e=>{
    if(e.key === 'Enter') attemptLogin();
    if(e.key === 'Escape') closeModal('loginOverlay');
  });

  setLocked(true);

  function stamp(){
    return new Date().toLocaleDateString('en-US',{month:'short',day:'2-digit'});
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      const reader = new FileReader();
      reader.onload = e=>{ img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function youtubeEmbed(url){
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([\w-]{6,})/);
    return m ? `https://www.youtube.com/embed/${m[1]}` : null;
  }

  // ---- PHOTOS ----
  const photoInput = document.getElementById('photoInput');
  document.getElementById('photoLabel').addEventListener('click', ()=>{
    if(!isUnlocked) return;
    photoInput.click();
  });
  photoInput.addEventListener('change', async e=>{
    for(const file of [...e.target.files]){
      try{
        const dataUrl = await compressImage(file, 1000, 0.72);
        const {error: perr} = await supabase.from('photos').insert({name:file.name, src:dataUrl, date_label:stamp()});
        if(perr) alert('Photo save failed: ' + perr.message);
      }catch(err){ console.error('photo upload failed', err); }
    }
    photoInput.value = '';
    loadPhotos();
  });

  function renderPhotos(photos){
    const grid = document.getElementById('photoGrid');
    document.getElementById('photoCount').textContent = photos.length + ' item' + (photos.length===1?'':'s');
    if(photos.length===0){
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">No photos yet. Upload the first one.</div>';
      return;
    }
    grid.innerHTML = photos.map(p=>`
      <div class="tile">
        <img src="${p.src}" alt="${escapeHtml(p.name)}">
        <div class="tile-meta">${escapeHtml(p.date_label)}</div>
      </div>
    `).join('');
  }
  async function loadPhotos(){
    const { data, error } = await supabase.from('photos').select('*').order('created_at', {ascending:false});
    if(!error) renderPhotos(data || []);
  }

  // ---- VIDEOS ----
  document.getElementById('videoAddBtn').addEventListener('click', ()=>{
    if(!isUnlocked) return;
    document.getElementById('videoTitleField').value = '';
    document.getElementById('videoUrlField').value = '';
    openModal('videoOverlay');
  });
  document.getElementById('cancelVideo').addEventListener('click', ()=>closeModal('videoOverlay'));
  document.getElementById('submitVideo').addEventListener('click', async ()=>{
    const title = document.getElementById('videoTitleField').value.trim();
    const url = document.getElementById('videoUrlField').value.trim();
    if(!title || !url) return;
    const {error: verr} = await supabase.from('link_items').insert({kind:'video', title, url, date_label:stamp()});
    if(verr){ alert('Video add failed: ' + verr.message); return; }
    closeModal('videoOverlay');
    loadVideos();
  });

  function renderVideos(videos){
    const grid = document.getElementById('videoGrid');
    document.getElementById('videoCount').textContent = videos.length + ' item' + (videos.length===1?'':'s');
    if(videos.length===0){
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">No videos yet. Add the first one.</div>';
      return;
    }
    grid.innerHTML = videos.map(v=>{
      const embed = youtubeEmbed(v.url);
      if(embed){
        return `<div class="tile"><iframe src="${embed}" allowfullscreen></iframe></div>`;
      }
      return `<div class="tile">
        <a class="video-link" href="${v.url}" target="_blank" rel="noopener">
          <div class="play-ico">▶</div>
          <div class="vtitle">${escapeHtml(v.title)}</div>
        </a>
      </div>`;
    }).join('');
  }
  async function loadVideos(){
    const { data, error } = await supabase.from('link_items').select('*').eq('kind','video').order('created_at', {ascending:false});
    if(!error) renderVideos(data || []);
  }

  // ---- NEWS ----
  document.getElementById('newPostBtn').addEventListener('click', ()=>{
    if(!isUnlocked) return;
    document.getElementById('headlineField').value = '';
    document.getElementById('bodyField').value = '';
    openModal('postOverlay');
    setTimeout(()=>document.getElementById('headlineField').focus(), 50);
  });
  document.getElementById('cancelPost').addEventListener('click', ()=>closeModal('postOverlay'));
  document.getElementById('submitPost').addEventListener('click', async ()=>{
    const headline = document.getElementById('headlineField').value.trim();
    const body = document.getElementById('bodyField').value.trim();
    if(!headline) return;
    const {error: nerr} = await supabase.from('news').insert({headline, body, date_label:stamp()});
    if(nerr){ alert('Post failed: ' + nerr.message); return; }
    closeModal('postOverlay');
    loadNews();
  });

  function renderNews(news){
    const list = document.getElementById('newsList');
    if(news.length===0){
      list.innerHTML = '<div class="empty-state">No news posted yet.</div>';
      return;
    }
    list.innerHTML = news.map(n=>`
      <div class="news-item">
        <div class="news-date">${escapeHtml(n.date_label)}</div>
        <div>
          <div class="news-headline">${escapeHtml(n.headline)}</div>
          <div class="news-body">${escapeHtml(n.body)}</div>
        </div>
      </div>
    `).join('');
  }
  async function loadNews(){
    const { data, error } = await supabase.from('news').select('*').order('created_at', {ascending:false});
    if(!error) renderNews(data || []);
  }

  // ---- FILES ----
  document.getElementById('fileAddBtn').addEventListener('click', ()=>{
    if(!isUnlocked) return;
    document.getElementById('fileNameField').value = '';
    document.getElementById('fileUrlField').value = '';
    openModal('fileOverlay');
  });
  document.getElementById('cancelFile').addEventListener('click', ()=>closeModal('fileOverlay'));
  document.getElementById('submitFile').addEventListener('click', async ()=>{
    const name = document.getElementById('fileNameField').value.trim();
    const url = document.getElementById('fileUrlField').value.trim();
    if(!name || !url) return;
    const {error: ferr} = await supabase.from('link_items').insert({kind:'file', title:name, url, date_label:stamp()});
    if(ferr){ alert('File add failed: ' + ferr.message); return; }
    closeModal('fileOverlay');
    loadFiles();
  });

  function extLabel(name){
    const parts = name.split('.');
    return parts.length>1 ? parts.pop().toUpperCase() : 'LINK';
  }

  function renderFiles(files){
    const list = document.getElementById('filesList');
    document.getElementById('fileCount').textContent = files.length + ' item' + (files.length===1?'':'s');
    if(files.length===0){
      list.innerHTML = '<div class="empty-state">No files yet. Add the first one.</div>';
      return;
    }
    list.innerHTML = files.map(f=>`
      <div class="file-row">
        <div class="file-icon">${extLabel(f.title)}</div>
        <div>
          <div class="file-name">${escapeHtml(f.title)}</div>
          <div class="file-sub">added ${escapeHtml(f.date_label)}</div>
        </div>
        <a class="dl" href="${f.url}" target="_blank" rel="noopener" style="margin-left:auto;">Open</a>
      </div>
    `).join('');
  }
  async function loadFiles(){
    const { data, error } = await supabase.from('link_items').select('*').eq('kind','file').order('created_at', {ascending:false});
    if(!error) renderFiles(data || []);
  }

  loadPhotos();
  loadVideos();
  loadNews();
  loadFiles();
</script>

</body>
